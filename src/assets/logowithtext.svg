<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80" role="img" aria-label="ExpenseTrack logo">
  <!-- emblem group (same visual language as favicon) -->
  <g transform="translate(12,8)" id="emblem">
    <rect x="0" y="0" width="64" height="64" rx="12" fill="#00BFA6"/>
    <circle cx="36" cy="28" r="14" fill="#FFD166" stroke="#F4A261" stroke-width="1.5"/>
    <path d="M36 22c0 2.2-3 2.2-3 4s3 1.8 3 4-3 2.2-3 4" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/>
    <line x1="35.5" y1="18.5" x2="35.5" y2="47.5" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round"/>
    <g transform="translate(-2,6)">
      <rect x="6" y="28" width="40" height="18" rx="6" fill="#2F2D52" stroke="#1f1d38" stroke-width="1.5"/>
      <path d="M6 28 q6 -10 20 -6 q10 3 14 6" fill="#3b3860" stroke="#1f1d38" stroke-width="1.2" />
      <circle cx="16" cy="37" r="2.2" fill="#F4A261"/>
      <rect x="40" y="32" width="4" height="8" rx="1.5" fill="#F4A261"/>
    </g>
  </g>

  <!-- Brand name -->
  <g transform="translate(92,48)" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="700" text-anchor="start">
    <!-- "Expense" -->
    <text x="0" y="0" font-size="28" fill="#333333">Expense</text>
    <!-- "Tracker" with accent color -->
    <text x="108" y="0" font-size="28" fill="#005F59">Track</text>
  </g>

  <!-- optional tagline -->
  <text x="92" y="68" font-size="10" fill="#6b6b6b" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">Simple • Friendly • Smart</text>
</svg>
